[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mario-latent-dream"
version = "0.1.0"
description = "DreamerV3 world-model reinforcement learning for Super Mario Bros."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gymnasium==1.2.2",
  "gym-super-mario-bros==9.1.0",
  "nes-py==9.0.1",
  "numpy>=2.0",
  "opencv-python>=4.8",
  "imageio[ffmpeg]>=2.34",
  "pillow>=10",
  "torch>=2.3",
  "stable-baselines3==2.8.0",
  "tqdm>=4.66",
  "tensorboard>=2.15",
  "wandb>=0.16",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
